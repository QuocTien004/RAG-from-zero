[project]
name = "rag-from-zero"
version = "0.1.0"
description = "RAG cơ bản với Google Gemini — xây dựng pipeline từ đầu không phụ thuộc framework"
authors = [
    { name = "QuocTien004", email = "quoctien391939@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pypdf>=4.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Package nằm trong thư mục src/ (layout "src" chuẩn, tránh import nhầm)
[tool.setuptools.packages.find]
where = ["src"]
